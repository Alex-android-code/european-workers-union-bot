# Template, not launched. Never point these services at production infrastructure.
name: ewu-isolated-staging
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ewu_staging
      POSTGRES_USER: ewu_staging_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - ewu_staging_pgdata:/var/lib/postgresql/data
      # Certificates must be owned/readable as required by the postgres image.
      - ${EWU_STAGING_TLS_DIR:?provide isolated TLS assets}:/tls:ro
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key"]
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ewu_staging_owner -d ewu_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
  bot:
    profiles: ["explicit-staging-bot"]
    build:
      context: .
      dockerfile: Dockerfile.staging
    environment:
      EWU_V2_ENABLED: "1"
      EWU_ENVIRONMENT: staging
      EWU_DATABASE_URL: ${EWU_STAGING_RUNTIME_DSN:?provide reviewed staging runtime DSN with verify-full}
      TELEGRAM_TOKEN: ${EWU_STAGING_TELEGRAM_TOKEN:?dedicated staging token only}
      PRIVACY_CONFIG_FILE: /legal/privacy.json
    volumes:
      - ${EWU_STAGING_POLICY_FILE:?reviewed staging policy}:/legal/privacy.json:ro
      - ${EWU_STAGING_TLS_DIR:?provide isolated TLS assets}:/tls:ro
    command: ["python", "bot.py"]
    depends_on:
      db:
        condition: service_healthy
secrets:
  db_password:
    file: ${EWU_STAGING_PASSWORD_FILE:?private staging password file}
volumes:
  ewu_staging_pgdata:
